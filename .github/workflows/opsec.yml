name: OPSEC Audit
on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv pytest
      - run: uv pip install -e .
      - run: pytest -q
      - run: audit_manifest tests/fixtures/AndroidManifest.xml --json --out report.json
      - uses: actions/upload-artifact@v4
        with:
          name: opsec-report
          path: report.json
