[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-tools"
version = "1.3.0"
description = "Android manifest security triage tool with interactive TUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "audit_tools team"}
]
dependencies = [
    "lxml>=6.0.0,<7.0.0",
    "textual>=0.50.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
tui = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "questionary>=2.0.0"
]
dev = [
    "pytest>=8.0.0",
    "tox>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "bandit>=1.7.0"
]

[project.scripts]
audit_manifest = "audit_manifest:main"
audit_tui = "tui.app:app.run"

[tool.pytest.ini_options]
testpaths = ["tests"]
