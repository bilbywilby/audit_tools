## 📄 `.github/workflows/stale.yml` (Issue Cleanup)

```yaml
name: "Close Stale Issues"

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs.
          stale-pr-message: |
            This PR has been automatically marked as stale because it has not had
            recent activity from the author. It will be closed if no further activity occurs.
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: 'bug,enhancement,pinned,security'
          exempt-pr-labels: 'bug,enhancement,pinned,security'
          operations-per-run: 100
```

