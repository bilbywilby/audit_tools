## 🚀 Setup Instructions

```bash
cd ~/audit_tools

# 1. Create the workflows directory
mkdir -p .github/workflows

# 2. Save the main CI file
cat > .github/workflows/ci.yml << 'ENDCI'
# Paste the full ci.yml content above
ENDCI

# 3. Add the optional files (if desired)
cat > .github/workflows/codeql.yml << 'ENDQ'
# Paste codeql.yml
ENDQ

# 4. Add dependabot
cat > .github/dependabot.yml << 'ENDD'
# Paste dependabot.yml
ENDD

# 5. Commit everything
git add .github/
git commit -m "ci: add comprehensive GitHub Actions workflow

- Multi-version Python matrix (3.10-3.13)
- Linting (black, flake8)
- Security scanning (bandit, safety, detect-secrets)
- Coverage reporting via Codecov
- Docker image build on tags
- PyPI publish on releases
- Scheduled nightly scans
- Failure notifications (optional)
"
git push origin main
```

